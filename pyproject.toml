[project]
name = "eventforge"
version = "0.1.0"
description = "Event sourcing framework for agentic AI systems"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eventforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/eventforge --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["src/eventforge"]
branch = true
