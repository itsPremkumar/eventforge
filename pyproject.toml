[project]
name = "eventforge"
version = "0.1.0"
description = "Event Sourcing Framework for Python"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
